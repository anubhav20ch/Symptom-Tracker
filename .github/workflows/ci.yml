name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (lint, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # SEC-20: fail the build on any high/critical dependency vulnerability.
      - run: npm audit --audit-level=high

  frontend:
    name: Frontend (lint, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  ml-service:
    name: ML service (lint, format check, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest --no-header -q || true # TEST-4: real tests land in Phase 6; this step is a no-op placeholder until then
      - run: pip install pip-audit && pip-audit --strict || true # advisory until Phase 6 pins/triages known findings

  docker-compose-health:
    name: Docker Compose build + health gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, ml-service]
    steps:
      - uses: actions/checkout@v4
      - name: Create a minimal backend/.env for the build
        run: |
          cat > backend/.env <<'EOF'
          JWT_SECRET=ci-only-placeholder-secret-not-for-real-use-0123456789abcdef
          NODE_ENV=production
          SEED_DEMO=false
          VAPID_PUBLIC_KEY=
          VAPID_PRIVATE_KEY=
          EOF
      # DEPLOY-11: bring the full stack up and fail the build unless every
      # service reports healthy, not merely "started".
      - run: docker compose up --build -d
      - name: Wait for all services to report healthy
        run: |
          for i in $(seq 1 30); do
            STATUSES=$(docker compose ps --format '{{.Health}}')
            echo "$STATUSES"
            if ! echo "$STATUSES" | grep -qv "healthy"; then
              echo "All services healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Services did not become healthy in time."
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
