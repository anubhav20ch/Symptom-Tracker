server {
    # 8080, not 80: binding a port below 1024 requires root, and this
    # container runs nginx as the unprivileged "nginx" user.
    listen 8080;
    server_name localhost;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # SEC-14: this is the policy that actually governs the SPA (the
    # backend's own CSP, set independently in backend/src/index.js, only
    # covers what the backend itself serves -- its JSON API and the
    # Swagger UI page -- since the browser enforces whichever CSP header
    # came with the HTML document, and nginx is what serves this one).
    # 'unsafe-inline' on style-src is required for React's style={{...}}
    # prop, which compiles to inline style="" attributes; eliminating it
    # needs a nonce-per-render scheme, which is deliberate future work
    # (see docs/GAP_ANALYSIS.md). No inline/eval script is used anywhere,
    # so script-src stays strict with no such exception.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # SEC-16: no /uploads/ proxy any more. Attachments and reports are
    # served only through authenticated, ownership-checked backend API
    # routes (under /api/, proxied above), never as static files.
}
