version: '3.8'

services:
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: symptomlog-ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: symptomlog-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides for the containerized topology only; everything else
      # (JWT_SECRET, TTLs, VAPID keys, etc.) comes from backend/.env above,
      # so there is a single source of truth for secrets.
      - PORT=5000
      - ML_SERVICE_URL=http://ml_service:8001
      - DB_MODE=sqlite
      - DATABASE_PATH=/app/data/symptomlog.sqlite
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:5173
      - COOKIE_SECURE=false
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    depends_on:
      ml_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Relative path so the browser talks to nginx same-origin, which
        # proxies /api/ and /uploads/ to the backend container (see nginx.conf).
        VITE_API_URL: /api
    container_name: symptomlog-frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_uploads:
